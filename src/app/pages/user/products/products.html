<section class="products-page">
  <app-page-header
    eyebrow="catalog"
    title="3 nhóm mặt hàng"
    [description]="selectedTypeInfo().description"
  />

  <nav class="category-filter" aria-label="Lọc theo nhóm mặt hàng">
    @for (type of typeFilters; track type.value) {
      <a
        routerLink="/products"
        [queryParams]="{ type: type.value }"
        [class.active]="selectedType() === type.value"
      >
        {{ type.label }}
      </a>
    }
  </nav>

  @if (error()) { <app-feedback-banner tone="error" [message]="error()!" /> }
  @if (loading()) {
    <div class="products-loading">@for (item of [1,2,3,4]; track item) { <span></span> }</div>
  } @else if (products().length) {
    <div class="products-grid">
      @for (product of products(); track product.id; let index = $index) {
        <app-product-card [product]="product" [animationDelay]="index * 60" />
      }
    </div>
  } @else {
    <app-empty-state title="Nhóm này chưa có mặt hàng" message="Admin thêm dữ liệu cho nhóm này để hiển thị tại đây." />
  }
</section>
