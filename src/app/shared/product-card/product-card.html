<article class="product-card">
  <a class="product-link" [routerLink]="['/products', product().id]">
    <div class="product-image">
      <img appImageFallback [src]="product().primaryImageUrl || product().images[0]?.imageUrl || '/images/product-placeholder.svg'" [alt]="product().name" loading="lazy" />
      <span class="type-pill">{{ product().typeLabel }}</span>
      <span class="image-action">Xem chi tiết ↗</span>
    </div>
    <div class="product-info"><h3>{{ product().name }}</h3><strong>{{ formatVnd(product().priceVnd) }}</strong></div>
  </a>
</article>
