<div class="quantity" aria-label="Số lượng">
  <button
    type="button"
    (click)="decrease()"
    [disabled]="isDisabled() || value() <= min()"
    aria-label="Giảm số lượng"
  >−</button>
  <span aria-live="polite">{{ value() }}</span>
  <button
    type="button"
    (click)="increase()"
    [disabled]="isDisabled() || value() >= max()"
    aria-label="Tăng số lượng"
  >+</button>
</div>
